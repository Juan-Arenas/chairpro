version: '3.8'

services:
  evolution-api:
    container_name: evolution_api
    image: atendai/evolution-api:v2.1.2
    restart: always
    ports:
      - "8080:8080"
    environment:
      # URL pública o local del servidor Evolution API
      - SERVER_URL=http://localhost:8080
      # Clave secreta global para administrar la API
      - AUTHENTICATION_API_KEY=CHAIRPRO_EVOLUTION_SECRET_KEY_2026
      
      # Configuración de base de datos para persistir sesiones
      - DATABASE_ENABLED=false
      
      # Configuración de Webhooks hacia ChairPro
      - WEBHOOK_GLOBAL_ENABLED=false
      
      # Logs
      - LOG_LEVEL=ERROR,WARN,DEBUG,INFO,LOG,VERBOSE,DARK,WEBHOOKS
      - LOG_COLOR=true
      - LOG_BAILEYS=error
      
      # Configuración de WhatsApp Baileys
      - QRCODE_LIMIT=30
      - DELAY_BEFORE_START=1000
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store

volumes:
  evolution_instances:
  evolution_store:
